# Separate workspace on purpose: Tauri needs webkit2gtk dev headers, which must not
# break `cargo build --workspace` of the daemon. Build: see app/README.md.
[workspace]

[package]
name = "kagent-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
