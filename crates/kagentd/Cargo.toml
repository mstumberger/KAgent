[package]
name = "kagentd"
version.workspace = true
edition.workspace = true

[dependencies]
kagent-core = { path = "../kagent-core" }
kagent-providers = { path = "../kagent-providers" }
anyhow.workspace = true
async-trait.workspace = true
regex.workspace = true
inotify = { version = "0.11", features = ["stream"] }
sha2.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
uuid.workspace = true
secret-service = { version = "6", default-features = false, features = ["rt-tokio", "crypto-rust"] }
ksni = "0.3.7"
x11rb = { version = "0.14.0", features = ["shape"] }

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
